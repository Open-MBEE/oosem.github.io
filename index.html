<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#0B1A2E;
    --bg-panel:#0F2340;
    --grid-line: rgba(143,166,191,0.14);
    --grid-line-strong: rgba(143,166,191,0.28);
    --text-primary:#EAF0F6;
    --text-muted:#93AAC4;
    --text-faint:#5D7690;
    --amber:#E8A33D;
    --serif: 'Spectral', Georgia, serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 42px 42px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 42px 42px,
      var(--bg-base);
    color:var(--text-primary);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:520px;
    padding:0 24px;
    text-align:left;
  }
  .mark{
    font-size:13px;
    color:var(--amber);
    letter-spacing:.02em;
    margin:0 0 22px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(30px, 6vw, 44px);
    line-height:1.15;
    margin:0 0 16px;
  }
  p{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--text-muted);
    line-height:1.7;
    margin:0 0 28px;
    max-width:48ch;
  }
  .frame{
    border:1px solid var(--grid-line-strong);
    background:var(--bg-panel);
    padding:16px 18px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--text-faint);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber);
    animation:pulse 1.8s ease-in-out infinite;
    flex:none;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.25;}
  }
  @media (prefers-reduced-motion: reduce){
    .dot{animation:none;}
  }
</style>
</head>
<body>
  <div class="card">
    <p class="mark">MBSE / SysML resource</p>
    <h1>Coming soon.</h1>
    <p>This page is still being drafted. Check back shortly, or watch the wiki sidebar for it to appear.</p>
    <div class="frame"><span class="dot"></span> in progress</div>
  </div>
</body>
</html>
